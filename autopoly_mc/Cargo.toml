[package]
name = "autopoly_mc"
version = "0.1.0"
edition = "2021"
description = "Rust Monte Carlo kernel for AutoPoly melt equilibration (KG bead-spring, connectivity-altering moves)"
license = "BSD-3-Clause"

[lib]
name = "autopoly_mc"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
rand = "0.9"
rand_chacha = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
